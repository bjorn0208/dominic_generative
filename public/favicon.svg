    <line x1="16" y1="12" x2="16" y2="14"/>
    <!-- Shoulders -->
    <line x1="8" y1="14" x2="24" y2="14"/>
    <!-- Arms -->
    <path d="M8 14 L4 22" stroke-width="1"/>
    <path d="M24 14 L28 22" stroke-width="1"/>
    <!-- Torso -->
    <line x1="12" y1="14" x2="12" y2="24" stroke-width="1"/>
    <line x1="16" y1="14" x2="16" y2="24" stroke-width="1"/>
    <line x1="20" y1="14" x2="20" y2="24" stroke-width="1"/>
    <!-- Hips -->
    <line x1="11" y1="24" x2="21" y2="24"/>
    <!-- Legs -->
    <path d="M13 24 L13 29" stroke-width="1"/>
    <path d="M19 24 L19 29" stroke-width="1"/>
    <!-- Feet -->
    <line x1="11" y1="29" x2="15" y2="29" stroke-width="1"/>
    <line x1="17" y1="29" x2="21" y2="29" stroke-width="1"/>
